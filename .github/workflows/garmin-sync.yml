name: Garmin Sync

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Garmin session
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-session
          restore-keys: |
            garmin-session

      - name: Install dependencies
        run: pip install -r garmin-sync/requirements.txt

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          APP_INGEST_URL: ${{ secrets.APP_INGEST_URL }}
          GARMIN_INGEST_SECRET: ${{ secrets.GARMIN_INGEST_SECRET }}
        run: python garmin-sync/sync.py
